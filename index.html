<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12091f">
  <title>Blockudoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell" aria-label="Blockudoku game">
    <div class="top-row">
      <button class="glass-icon-button" id="homeButton" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5.5 9.5V21h13V9.5"></path></svg>
      </button>
      <div class="top-actions">
        <button class="glass-icon-button" id="soundButton" aria-label="Toggle sound" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15h4l5 4V5L8 9H4z"></path><path d="M17 8.5a5.5 5.5 0 010 7"></path></svg>
        </button>
        <button class="glass-icon-button" id="settingsButton" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7z"></path><path d="M19.4 13.5a1 1 0 00.2 1.1l.1.1a2 2 0 01-2.8 2.8l-.1-.1a1 1 0 00-1.1-.2 1 1 0 00-.6.9V19a2 2 0 01-4 0v-.2a1 1 0 00-.6-.9 1 1 0 00-1.1.2l-.1.1a2 2 0 01-2.8-2.8l.1-.1a1 1 0 00.2-1.1 1 1 0 00-.9-.6H5a2 2 0 010-4h.2a1 1 0 00.9-.6 1 1 0 00-.2-1.1l-.1-.1a2 2 0 012.8-2.8l.1.1a1 1 0 001.1.2 1 1 0 00.6-.9V5a2 2 0 014 0v.2a1 1 0 00.6.9 1 1 0 001.1-.2l.1-.1a2 2 0 012.8 2.8l-.1.1a1 1 0 00-.2 1.1 1 1 0 00.9.6h.2a2 2 0 010 4h-.2a1 1 0 00-.9.6z"></path></svg>
        </button>
      </div>
    </div>

    <section class="stats-panel glass-panel" aria-label="Game stats">
      <div class="stat-pill">
        <div class="stat-icon lavender">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8l2.47 5 5.53.8-4 3.9.94 5.5L12 16.3 7.06 19l.94-5.5-4-3.9 5.53-.8z"></path></svg>
        </div>
        <div class="stat-value" id="scoreValue">0</div>
      </div>
      <div class="stat-pill">
        <div class="stat-icon gold">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16l-1.4-8-4.1 3.2L12 7 9.5 13.2 5.4 10z"></path></svg>
        </div>
        <div class="stat-value" id="bestValue">0</div>
      </div>
      <div class="stat-pill">
        <div class="stat-icon lilac">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9"></path><path d="M12 19V5"></path><path d="M19 19v-7"></path></svg>
        </div>
        <div class="stat-value" id="levelValue">1</div>
      </div>
    </section>

    <section class="board-panel glass-panel">
      <div class="board-frame">
        <div id="board" class="board" role="grid" aria-label="9 by 9 game board"></div>
      </div>
    </section>

    <section class="tray-panel glass-panel" aria-label="Available pieces">
      <div class="tray" id="tray"></div>
    </section>
  </main>

  <div class="drag-layer" id="dragLayer" aria-hidden="true"></div>

  <div class="modal-backdrop" id="settingsModal" hidden>
    <div class="modal glass-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Settings</h2>
      <div class="modal-actions">
        <button class="modal-button" id="toggleSoundModal">Sound: On</button>
        <button class="modal-button" id="restartGameButton">Restart Game</button>
        <button class="modal-button" id="closeSettingsButton">Close</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
