<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#130b21">
  <meta name="description" content="A cozy, glowing endless Blockudoku puzzle.">
  <title>Blockudoku</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main class="app-shell" aria-label="Blockudoku game">
    <header class="top-row">
      <button type="button" class="glass-icon-button" id="homeButton" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.7 10.4 12 2.9l9.3 7.5"></path><path d="M5.8 9.3V21h12.4V9.3"></path><path d="M10 21v-7h4v7"></path></svg>
      </button>
      <div class="top-actions">
        <button type="button" class="glass-icon-button" id="soundButton" aria-label="Mute sound" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 9h4.1L13 4.8v14.4L7.5 15H3.4z"></path><path class="sound-waves" d="M16.8 8.3c1.1 1 1.7 2.2 1.7 3.7s-.6 2.7-1.7 3.7M19.3 5.2c1.9 1.9 3 4.2 3 6.8s-1.1 4.9-3 6.8"></path><path class="sound-slash" d="m16 9 6 6"></path></svg>
        </button>
        <button type="button" class="glass-icon-button" id="settingsButton" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M10.4 2.8h3.2l.5 2.1c.5.2 1 .4 1.4.6l1.9-1.1 2.3 2.3-1.1 1.9c.2.4.4.9.6 1.4l2.1.5v3.2l-2.1.5c-.2.5-.4 1-.6 1.4l1.1 1.9-2.3 2.3-1.9-1.1c-.4.2-.9.4-1.4.6l-.5 2.1h-3.2l-.5-2.1c-.5-.2-1-.4-1.4-.6l-1.9 1.1-2.3-2.3 1.1-1.9c-.2-.4-.4-.9-.6-1.4l-2.1-.5v-3.2l2.1-.5c.2-.5.4-1 .6-1.4L4.3 6.7l2.3-2.3 1.9 1.1c.4-.2.9-.4 1.4-.6z"></path></svg>
        </button>
      </div>
    </header>

    <section class="stats-panel glass-panel" aria-label="Score, high score, and level">
      <div class="stat-pill" aria-label="Current score"><span class="stat-icon lavender" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 15 8.5l7 1-5 4.9 1.2 7L12 17.9l-6.2 3.5 1.2-7L2 9.5l7-1z"></path></svg></span><span class="stat-value" id="scoreValue">0</span></div>
      <div class="stat-pill" aria-label="Best score"><span class="stat-icon gold" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.8 7 7.7 11 12 4l4.3 7L21.2 7l-1.5 11H4.3z"></path><path d="M5 20h14"></path></svg></span><span class="stat-value" id="bestValue">0</span></div>
      <div class="stat-pill" aria-label="Level"><span class="stat-icon lilac" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="8" rx="1"></rect><rect x="10" y="7" width="4" height="13" rx="1"></rect><rect x="17" y="3" width="4" height="17" rx="1"></rect></svg></span><span class="stat-value" id="levelValue">1</span></div>
    </section>

    <section class="board-panel glass-panel" aria-label="9 by 9 block puzzle board">
      <div id="board" class="board" role="grid" aria-label="9 by 9 game board"></div>
    </section>

    <section class="tray-panel glass-panel" aria-label="Three available block pieces">
      <div id="tray" class="tray"></div>
    </section>
  </main>

  <div class="drag-layer" id="dragLayer" aria-hidden="true"></div>

  <div class="modal-backdrop" id="settingsModal" hidden>
    <div class="modal glass-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Settings</h2>
      <p id="dialogMessage" hidden></p>
      <div class="modal-actions">
        <button type="button" class="modal-button" id="toggleSoundModal">Sound: On</button>
        <button type="button" class="modal-button" id="restartGameButton">New game</button>
        <button type="button" class="modal-button" id="closeSettingsButton">Continue</button>
      </div>
    </div>
  </div>
  <div class="screenreader" aria-live="polite" id="announcer"></div>

  <script src="engine.js?v=5"></script>
  <script src="game.js?v=5"></script>
</body>
</html>
